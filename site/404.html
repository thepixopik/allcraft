<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Redirecting — The AllCraft Studio</title>
  <script>
    (() => {
      const segs = location.pathname.split("/").filter(Boolean);
      const apps = ["photo", "vector", "film", "light", "pdf", "effect", "ani", "design", "texture", "material", "sound", "word", "deck", "cad", "grid"];
      const lastApp = [...segs].reverse().find((s) => apps.includes(s));
      if (lastApp && location.pathname !== "/" + lastApp + "/") {
        location.replace("/" + lastApp + "/");
      }
    })();
  </script>
  <style>
    html, body { margin: 0; height: 100%; background: #0b0b0c; color: #f4f4f6; font: 15px/1.5 system-ui, sans-serif; display: flex; align-items: center; justify-content: center; text-align: center; }
    .box { max-width: 440px; padding: 28px; background: #141418; border: 1px solid #282830; border-radius: 0; }
    a { display: inline-block; margin-top: 16px; padding: 10px 18px; background: #f5f5f7; color: #0b0b0c; text-decoration: none; font-weight: 700; font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; }
  </style>
</head>
<body>
  <div class="box">
    <h2 style="margin:0 0 8px">Page Not Found</h2>
    <p style="margin:0;color:#9ca3af">That path doesn't exist on The AllCraft Studio.</p>
    <a href="/">Back to Studio Launcher &rarr;</a>
  </div>
</body>
</html>
